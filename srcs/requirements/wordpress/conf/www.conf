[www]
user  = www-data
group = www-data

; A TCP socket, not the Debian default unix socket. A unix socket is a file on
; a filesystem, so it cannot cross a container boundary — nginx runs in a
; different container and reaches us over the docker network.
; 0.0.0.0 rather than 127.0.0.1: the connection arrives from another container.
listen = 0.0.0.0:9000

listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Process pool. php-fpm keeps interpreters warm instead of forking one per
; request the way plain CGI did — that is the whole point of FastCGI.
pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Keep the container's environment visible to PHP. Cleared by default.
clear_env = no

; Send worker output to the container log so `docker logs wordpress` is useful.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
